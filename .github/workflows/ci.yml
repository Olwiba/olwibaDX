name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run tsc

      - name: Build
        run: bun run build

      - name: Validate package exports
        run: |
          bun -e 'for (const path of ["@olwiba/dx", "@olwiba/dx/eslint", "@olwiba/dx/skills", "@olwiba/dx/generate-previews", "@olwiba/dx/ascii", "@olwiba/dx/ascii-gif", "@olwiba/dx/generate-assets"]) await import(path)'
          npm pack --dry-run

      - name: Validate CLI
        run: bun dist/cli.js --help
