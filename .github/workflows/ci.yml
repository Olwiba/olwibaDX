name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run tsc

      - name: Build
        run: bun run build

      - name: Validate package exports
        run: |
          bun -e 'for (const path of ["@olwiba/dx", "@olwiba/dx/eslint", "@olwiba/dx/skills", "@olwiba/dx/generate-previews", "@olwiba/dx/ascii", "@olwiba/dx/ascii-gif", "@olwiba/dx/generate-assets", "@olwiba/dx/env-check"]) await import(path)'
          npm pack --dry-run

      - name: Validate CLI
        run: bun dist/cli.js --help

      # The docs site is built from this same repo but is not part of the
      # published package, so nothing above touches it. Last, because the tsup
      # build these steps follow writes to the same dist/.
      #
      # Build before typecheck: `site/routeTree.gen.ts` is generated by the
      # TanStack Start plugin during the vite build and is gitignored, so on a
      # fresh checkout it does not exist yet and every route fails to resolve.
      - name: Build site
        run: bun run web:build

      - name: Typecheck site
        run: bun run types:check

      - name: Check the docs pages document what they show
        run: bun run docs:check
